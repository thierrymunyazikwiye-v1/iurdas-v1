*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}

.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 14px}.brand img{width:46px;height:46px;border-radius:50%;background:#fff}
.brand b{font-size:13px;line-height:1.2;display:block}.brand span{font-size:11px;opacity:.7}

main{flex:1;min-width:0;padding:16px 20px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}

.grid{display:grid;gap:12px;grid-template-columns:repeat(12,1fr);margin-bottom:12px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}

<div class="c s12"><h2>Security and audit log</h2>${AL.slice(0,12).map(x=>`<div class="row"><u style="width:130px">${esc(x[0])}</u><span>${esc(x[1])}: ${x[2]}</span></div>`).join('')||'<p class="note">No events yet.</p>'}<div class="note">Sessions end after 15 minutes of inactivity; five failed sign-ins lock the form for one minute.</div></div>`;
V.hub=()=>`<div class="c"><div class="drop"><h2>Upload existing or new datasets</h2><p class="note">CSV, Excel, PDF, Word, images, audio. Cleaning and standardisation run automatically by file type.</p><input type="file" id="fi" multiple onchange="clean(this.files)"></div><div id="log"></div>
<h2 style="margin-top:14px">Export cleaned data</h2>${['CSV','Excel','PDF','Word','Image','Audio'].map(x=>`<button class="b ${exp('hub')?'':'g'}" ${exp('hub')?'':'disabled'} onclick="toast('${x} export queued. Downloads need file storage enabled in the live version.')">${x}</button>`).join(' ')}<p class="note">${exp('hub')?'':'Your role has no export permission for this module.'}</p></div>`;
async function clean(fl){let h='';for(const x of fl){const e=x.name.split('.').pop().toLowerCase();h+=`<pre><b>${x.name}</b> (${(x.size/1024).toFixed(1)} KB)\n`;
if(e=='csv'){const t=(await x.text()).split(/\r?\n/).filter(l=>l.trim());const hd=t[0].split(','),rows=t.slice(1),seen=new Set();let dup=0,bl=0,ws=0;rows.forEach(r=>{if(seen.has(r))dup++;seen.add(r);r.split(',').forEach(c=>{if(!c.trim())bl++;if(c!=c.trim())ws++})});const gi=hd.findIndex(c=>/gender|sex/i.test(c));let g=0;if(gi>=0)rows.forEach(r=>{const v=(r.split(',')[gi]||'').trim();if(v&&!/^(Female|Male)$/.test(v))g++});
h+=`Type: CSV, ${rows.length} rows, ${hd.length} columns\n✓ Headers standardised to snake_case: ${hd.map(c=>c.trim().toLowerCase().replace(/\W+/g,'_')).slice(0,6).join(', ')}\n✓ Whitespace trimmed in ${ws} cells\n✓ ${dup} duplicate rows flagged\n✓ ${bl} blank cells flagged for imputation or review\n${gi>=0?`✓ Gender coded to Female / Male: ${g} values recoded\n`:''}✓ Fields mapped to ISCED / ISCED-F where programme or level columns exist`}
else{const m={xlsx:'Excel: sheets detected, header row located, merged cells split, types inferred',xls:'Excel: sheets detected, header row located, merged cells split, types inferred',pdf:'PDF: tables and text extracted, OCR applied to scanned pages',docx:'Word: tables extracted, narrative indexed for reports',png:'Image: OCR and metadata extracted',jpg:'Image: OCR and metadata extracted',mp3:'Audio: speech transcribed, speakers and topics tagged',wav:'Audio: speech transcribed, speakers and topics tagged'};h+=`✓ ${m[e]||'Stored and indexed'}\n(Demo: full processing runs in the live pipeline.)`}h+='</pre>'}$('#log').innerHTML=h}
let rpt='';
V.rep=()=>`${rbPanel()}<div class="grid"><div class="c s4"><h2>Complete structured report</h2><p class="note">Period: ${plab()}. Change it in the Executive Dashboard.</p>${[['exec','Executive summary'],['sp','Strategic plan & M&E'],['reg','Students'],['hr','Human resources'],['res','Research'],['fin','Finance'],['spt','Sports & welfare']].filter(x=>can(x[0])).map(x=>`<label><input type="checkbox" class="rs" value="${x[0]}" checked> ${x[1]}</label><br>`).join('')}<p><b>Analytics layers</b><br><label><input type="checkbox" checked> Descriptive</label> <label><input type="checkbox" checked> Diagnostic</label><br><label><input type="checkbox" checked> Predictive</label> <label><input type="checkbox" checked> Prescriptive</label></p><button class="b" onclick="mk()">Generate report</button><p>${['PDF','Word','PowerPoint'].map(x=>`<button class="b ${exp('rep')?'':'g'}" ${exp('rep')?'':'disabled'} onclick="toast('${x} export queued.')">${x}</button>`).join(' ')}</p></div><div class="c s8 rep" id="rp">${rpt||'<p class="note">Choose scope and layers, then generate. Charts and narrative are produced from live module data.</p>'}</div></div>`;
function mk(){const p=proj(),g=(FEM[11]/TOT[11]*100).toFixed(1);rpt=`<h2>${col=='All'?'University of Rwanda':'University of Rwanda, '+col}: ${per} Institutional Performance Report, ${plab()}</h2>
<h3>1. Descriptive: what happened</h3><p>Enrollment reached ${f(adj(K[0],K[0].a[yr]))} students${yr?`, ${((K[0].a[yr]/K[0].a[yr-1]-1)*100).toFixed(1)}% versus ${YRS[yr-1]}`:''}. Women are ${adj(K[1],K[1].a[yr]).toFixed(1)}% of students and 31% of academic staff. 82.1% of students are government sponsored. Total revenue was ${mny(adj(K[8],K[8].a[yr]))}.</p><p>Progress over ${yr+1} reporting year(s): scorecard for ${plab()} below.</p><div class="sc">${sc()}</div>${modsum()}${bars(CO.slice(0,5),25)}
<h3>2. Diagnostic: why it happened</h3><p>Growth followed the 2022-23 intake expansion in education and business. Female share is lowest in STEM (20.7% of STEM students are women versus 14.9% in non-STEM share terms), driven by lower application rates rather than lower admission rates.</p>
<h3>3. Predictive: what is likely</h3><p>If the five-year trend holds, enrollment will reach ${f(p[0])}, ${f(p[1])} and ${f(p[2])} over the next three years. Facilities utilisation (74%) would pass 85% by the second year.</p>
<h3>4. Prescriptive: what to do</h3><p>1) Add targeted scholarships and bridging courses for women in STEM. 2) Phase lecture-hall and hostel expansion before year two. 3) Lift budget execution above 90% through earlier procurement planning. 4) Recruit PhD-qualified staff to reach a 30:1 or better student-staff ratio in CST and CMHS.</p><p class="note">Reference frameworks: ISCED 2011, ISCED-F 2013, UNESCO UIS indicators, SDG 4 and 5.</p>`;go()}
V.adm=()=>`<div class="grid">${usersCard()}<div class="c s12"><h2>Role access matrix</h2><p class="note">College Principal is bound to one assigned college and sees only that college's dashboard, finance and reports (assign it in the top bar for this demo).</p><div class="sc"><table><tr><th>Module</th>${Object.keys(ROLES).map(r=>`<th>${r}</th>`).join('')}</tr>${MODS.map(m=>`<tr><td>${m.i} ${m.n}</td>${Object.keys(ROLES).map(r=>`<td><select ${r=='System Administrator'?'disabled':''} onchange="P['${r}']['${m.id}']=+this.value;nav()">${LV.map((l,i)=>`<option value="${i}" ${P[r][m.id]==i?'selected':''}>${l}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</table></div></div>
<div class="c s6"><h2>Link a new module or sub-system</h2><input id="nm" placeholder="Module name, e.g. Library Services"> <button class="b" onclick="addM()">Add module</button><p class="note">New modules get their own dashboard, upload area and export rules, and appear in the matrix for role assignment.</p></div>
<div class="c s6"><h2>Organisation structure</h2><div class="sc" style="max-height:170px">${UNITS.map(u=>`<div>• ${u}</div>`).join('')}</div><input id="nu" placeholder="Add school, centre, division or unit"> <button class="b" onclick="UNITS.push($('#nu').value||'New unit');go()">Add</button></div></div>`;
function addM(){const n=$('#nm').value.trim();if(!n)return toast('Enter a module name first.');const id='m'+MODS.length;MODS.push({id,n,i:'🧩'});V[id]=()=>`<div class="grid"><div class="c s12"><h2>${n}</h2><p class="note">Standalone dashboard area. Upload datasets in the Data Hub, then build executive and operational views here.</p></div></div>`;Object.keys(P).forEach(r=>P[r][id]=r=='System Administrator'?3:0);toast(n+' added.');go()}
function nav(){$('#nav').innerHTML=MODS.filter(m=>can(m.id)).map(m=>`<button class="${m.id==view?'on':''}" onclick="view='${m.id}';go()"><span>${m.i}</span>${m.n}</button>`).join('')}
function go(){if(LK(role))col=pc;$('#pcs').style.display=LK(role)&&isAdm()?'':'none';$('#role').style.display=isAdm()?'':'none';$('#who').textContent=cu?cu.n+' · '+cu.e+' · '+cu.r:'';$('#th').textContent=thLabel();if(!can(view))view=MODS.find(m=>can(m.id)).id;nav();const m=MODS.find(x=>x.id==view);$('#ttl').textContent=m.n;$('#sub').textContent=role+' · '+(P[role][view]>=3?'view, edit, export':P[role][view]==2?'view, edit':'view only');$('#v').innerHTML=(['sp','reg','hr','res','fin','spt','rep'].includes(view)?chips():'')+(MD[view]?mb(view):'')+V[view]()}
$('#role').innerHTML=Object.keys(ROLES).map(r=>`<option>${r}</option>`).join('');$('#pcs').innerHTML=CO.map(c=>`<option>${c[0]}</option>`).join('');$('#pcs').value=pc;$('#pcs').onchange=e=>{pc=e.target.value;go()};$('#role').onchange=e=>{role=e.target.value;col=LK(role)?pc:'All';go()};boot();
fetchSupabaseUsers();
</script></body></html>
